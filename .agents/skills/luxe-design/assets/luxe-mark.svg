<!-- The Luxe mark: an ivory tile, a 2px cocoa keyline, and a serif L.
     Colours are literals because an SVG cannot read a CSS custom property; both
     are values that exist in the token file, as the canvas and the dark fill.
     This is the same artwork as the browser-tab favicon in src/luxe-brand.js -
     the letterform path is byte-identical, and a test fails if they drift.
     Do not redraw it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Luxe">
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#f7f4ee" stroke="#463527" stroke-width="2" />
  <path d="M8.5 7.25H17V8.35L14.8 8.95V21.4H20.25C22.15 21.4 23.05 20.45 23.85 18.7L25 19.05L24.05 24H8.5V22.9L11.4 22.2V8.95L8.5 8.35Z" fill="#463527" />
</svg>
